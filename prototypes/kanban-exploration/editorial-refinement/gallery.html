<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskFlow · Estúdio Editorial refinado</title>
<style>
body{font:16px/1.5 system-ui,sans-serif;margin:0;padding:28px;background:#f8f4ef;color:#30253c}h1{font-size:28px;margin:0 0 12px}header{max-width:1280px;margin:auto}nav{display:flex;flex-wrap:wrap;gap:16px;margin:20px 0}label{display:grid;gap:6px}select,a{color:inherit}select{font:inherit;min-height:44px;padding:8px;background:#fffdfa;border:1px solid #917c99;border-radius:10px}a:focus-visible,select:focus-visible{outline:3px solid #7040a0;outline-offset:3px}#sheet{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;max-width:1280px;margin:auto;align-items:start}figure{margin:0}figcaption{font-weight:600;margin-bottom:12px}img{display:block;width:100%;height:auto;border-radius:12px}body[data-theme=dark]{background:#211a29;color:#f6edf9}body[data-theme=dark] select{background:#2d2437;border-color:#a88bbc}body[data-theme=dark] :focus-visible{outline-color:#d5b2f1}@media(max-width:700px){body{padding:18px}#sheet{grid-template-columns:1fr}}
</style></head>
<body><header><h1>Estúdio Editorial</h1><p>Refinamentos para revisão · Design System proposto · Fase 3</p><a href="index.html">Abrir protótipo interativo</a><nav aria-label="Comparação visual"><label>Tema<select id="theme"><option value="light">Claro</option><option value="dark">Escuro</option></select></label><label>Comparar<select id="view"><option value="mobile">Mobile: empilhadas × abas</option><option value="desktop">Desktop</option><option value="states">Estados dos componentes</option><option value="keyboard-focus">Foco real de teclado</option></select></label></nav></header><main id="sheet"></main>
<script>
const theme=document.getElementById('theme'),view=document.getElementById('view'),sheet=document.getElementById('sheet');
function render(){document.body.dataset.theme=theme.value;sheet.innerHTML=['stacked','tabs'].map((layout,i)=>`<figure><figcaption>${i===0?'Colunas empilhadas':'Navegação por abas'} · ${theme.options[theme.selectedIndex].text}</figcaption><a href="screenshots/${layout}-${theme.value}-${view.value}.png"><img src="screenshots/${layout}-${theme.value}-${view.value}.png" alt="Estúdio Editorial, ${layout==='stacked'?'colunas empilhadas':'abas'}, ${theme.value==='light'?'claro':'escuro'}, ${view.options[view.selectedIndex].text}"></a></figure>`).join('');}theme.addEventListener('change',render);view.addEventListener('change',render);render();
</script></body></html>
